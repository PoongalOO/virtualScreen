name: Release

# SS-093 : construit l'APK de release sur un tag `v*`, calcule sa somme de contrôle et publie une Release GitHub avec
# les notes tirées de CHANGELOG.md. N'ajoute AUCUN secret de dépôt : l'APK produit est volontairement NON SIGNÉ (voir
# app/build.gradle.kts, décision explicite en attente d'une stratégie de garde du keystore) ; ce workflow ne fait que
# publier l'artefact, il ne peut être installé par personne tant qu'il n'a pas été signé.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # nécessaire pour créer la Release et y attacher des fichiers

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Le tag doit correspondre à versionName (app/build.gradle.kts) : sinon un tag pris au hasard publierait une
      # Release dont le nom ne correspond pas à ce que l'application elle-même annonce (Diagnostic).
      - name: Check the tag matches versionName
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::le tag ${GITHUB_REF_NAME} ne correspond pas à versionName=$GRADLE_VERSION (app/build.gradle.kts)"
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK and compute its checksum
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT="SecondScreen-${GITHUB_REF_NAME}-unsigned.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          cat "$OUT.sha256"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"

      # Section du CHANGELOG correspondant à cette version, entre son titre ("## [X.Y.Z] - ...") et le titre suivant
      # (ou la fin du fichier). Un CHANGELOG sans section pour ce tag donne des notes vides plutôt qu'une erreur : le
      # tag reste publiable, mais la Release GitHub l'indiquera clairement en relisant le résultat avant de le diffuser.
      - name: Extract release notes from CHANGELOG.md
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG_VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "_Aucune section CHANGELOG.md pour ${TAG_VERSION} : notes à compléter à la main._" > release-notes.md
          fi
          {
            echo "**APK non signé** (voir app/build.gradle.kts) : ne s'installe pas tel quel, il faut le signer d'abord (\`apksigner sign\`)."
            echo
            cat release-notes.md
          } > release-notes-final.md
          cat release-notes-final.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${APK_NAME}" \
            "${APK_NAME}.sha256" \
            --title "SecondScreen ${GITHUB_REF_NAME}" \
            --notes-file release-notes-final.md
